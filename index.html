<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurForm - Accueil</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #131c35;
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-color: #00e5ff;
            --warning-color: #fbbf24;
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 20px; }

        /* Barre de navigation haute */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px;
        }
        .btn { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; border: 1px solid var(--glass-border); }
        .btn-signup { background: transparent; color: white; }
        .btn-login { background: var(--primary-color); color: var(--bg-color); border: none; }

        /* Structure en 3 colonnes */
        .layout-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            max-width: 1400px;
            margin: auto;
        }

        .panel { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--glass-border); }
        .center-column { display: flex; flex-direction: column; gap: 20px; }
        h1, h3 { color: #fff; margin-bottom: 15px; }

        .qcm-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        button.premium-btn {
            background: var(--warning-color);
            color: var(--bg-color);
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .sidebar-right { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--glass-border); }
        .module-item { font-size: 0.9rem; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <nav class="top-nav">
        <button class="btn btn-signup">Inscription</button>
        <button class="btn btn-login">Connexion</button>
    </nav>

    <div class="layout-container">
        <aside class="panel">
            <h3>Programme</h3>
            <p>Programme d'Entraînement</p>
        </aside>

        <main class="center-column">
            <div class="panel">
                <h1>Maîtrisez votre avenir</h1>
                <div class="qcm-list">
                    <div class="qcm-item">U.V. 2 : Environnement Juridique</div>
                    <div class="qcm-item">U.V. 3 : Gestion des Conflits</div>
                    <div class="qcm-item">U.V. 5 : Prévention Risques Incendie</div>
                </div>
                <button class="premium-btn">DÉBLOQUER LE PACK RÉUSSITE PREMIUM</button>
            </div>
        </main>

        <aside class="sidebar-right">
            <h3>MODULES DE FORMATION</h3>
            <div class="module-item">UV 1 : Secours tactiques</div>
            <div class="module-item">UV 2 : Cadre Juridique</div>
        </aside>
    </div>

</body>
</html>
